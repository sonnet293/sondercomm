<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/character.css">
    <title>캐릭터</title>
    <style>
        .marquee-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #fff;
      padding: 10px 0;
    }
 
    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee-scroll 20s linear infinite;
    }

    .marquee-wrap:hover .marquee-track {
      animation-play-state: paused;
    }
 
    .marquee-text {
      white-space: nowrap;
      font-size: 1.1rem;
      color: #333;
      padding-right: 80px; 
      font-family: sans-serif;
    }
 
    @keyframes marquee-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
 
    .marquee-edit-btn {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      background: rgba(255 255 255 / 0.15);
      border: 1px solid rgba(255 255 255 / 0.3);
      border-radius: 6px;
      color: #666;
      font-size: 0.85rem;
      padding: 3px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }
    .marquee-edit-btn:hover {
      background: rgba(255 255 255 / 0.28);
    }

    .marquee-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0 0 0 / 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
 
    .marquee-modal {
      background: #fff;
      border-radius: 12px;
      padding: 28px 24px 20px;
      width: min(480px, 90vw);
      box-shadow: 0 8px 32px rgba(0 0 0 / 0.25);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
 
    .marquee-modal-title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
    }
 
    .marquee-modal-page {
      margin: 0;
      font-size: 0.85rem;
      color: #666;
    }
 
    .marquee-modal-textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    .marquee-modal-textarea:focus {
      border-color: #555;
    }
 
    .marquee-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
 
    .marquee-btn-cancel,
    .marquee-btn-save {
      padding: 7px 18px;
      border-radius: 7px;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .marquee-btn-cancel {
      background: #eee;
      color: #333;
    }
    .marquee-btn-save {
      background: #222;
      color: #fff;
    }
    .marquee-btn-save:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .marquee-btn-cancel:hover { opacity: 0.8; }
    .marquee-btn-save:hover:not(:disabled) { opacity: 0.85; }
 
    .marquee-modal-msg {
      margin: 0;
      font-size: 0.82rem;
      color: #555;
      min-height: 1.2em;
    }
    </style>
</head>
<body>
    
    <!--깃발 / 로고-->
    <div class="top-area">
        <a href="index.html" class="main-flag">
            <img src="img/Flag.png" alt="메인 깃발" />
        </a>
        <a href="index.html" class="main-btn">메인</a>
        <div class="site-logo">
            <img src="img/Chara Logo.png" alt="캐릭터 로고" />
        </div>
    </div>

    <header class="site-header">
        <div id="marquee-board" data-page-id="character">캐릭터 전광판</div>
        <nav>
            <div class="nav-btn">
                <a href="guestbook.html">방명록</a>
            </div>
            <div class="nav-btn">
                <a href="character.html">캐릭터</a>
            </div>
            <div class="nav-btn">
                <a href="backup.html">백업</a>
            </div>
        </nav>
    </header>

    <!--메인 영역-->
    <main>
        <div id="gallery" class="gallery"></div>
    </main>

    <!--편집 모달-->
    <div id="editModal" class="modal-overlay" hidden>
        <div class="modal-box">
            <h2 class="modal-title">카드 편집</h2>

            <div class="modal-preview">
                <img src="" alt="미리보기" id="previewImg" hidden />
                <div id="previewPlaceholder" class="preview-placeholder">+</div>
            </div>

            <label for="fileInput" class="file-label">이미지 선택</label>
            <input type="file" id="fileInput" accept="image/*" hidden />

            <input type="text" id="nameInput" class="name-input" placeholder="제목 입력" maxlength="20" />

            <p id="modalError" class="modal-error" hidden></p>

            <div class="modal-actions">
                <button id="removePhotoBtn" class="btn-text">삭제</button>
                <div class="modal-action-right">
                    <button id="cancelBtn" class="btn-cancel">취소</button>
                    <button id="saveBtn" class="btn-save">저장</button>
                </div>
            </div>
        </div>

    </div>
    
    <script type="module" src="js/board.js"></script>
    <script type="module" src="js/character.js"></script>
</body>
</html>
